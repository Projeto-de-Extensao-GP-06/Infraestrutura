name: CI - Infra (Validacao Terraform e Ansible)

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  terraform-validate:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.0'

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Verificar presenca de credenciais AWS
        id: check-aws
        run: |
          if [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && [ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "has_credentials=true" >> $GITHUB_OUTPUT
          else
            echo "has_credentials=false" >> $GITHUB_OUTPUT
            echo "Aviso: Credenciais AWS ausentes nos secrets. terraform validate rodara sem chamadas externas."
          fi

      - name: Configurar credenciais AWS (para validate)
        if: steps.check-aws.outputs.has_credentials == 'true'
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Instalar ansible-lint
        run: pip install ansible-lint

      - name: Rodar ansible-lint
        run: ansible-lint ansible/playbooks/
        continue-on-error: true  # Lint e informativo, nao bloqueia o PR
