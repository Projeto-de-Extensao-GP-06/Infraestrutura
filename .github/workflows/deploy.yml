name: CI/CD Pipeline - SGPJ Infrastructure & App

on:
  push:
    branches:
      - main
      - refatoracao
  workflow_dispatch:
    inputs:
      enable_observability:
        description: 'Habilitar EC2 e servicos de Observabilidade (Grafana/Prometheus/Loki)?'
        required: true
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy-infrastructure:
    name: Provisionar Terraform e Ansible
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Extrair Credenciais AWS do Secret JSON
        id: aws-creds
        env:
          AWS_CREDENTIALS_RAW: ${{ secrets.AWS_CREDENTIALS }}
        run: |
          echo "$AWS_CREDENTIALS_RAW" | tr -d '\r' > /tmp/aws_creds.json
          KEY_ID=$(jq -r '.aws_access_key_id // .access_key // empty' /tmp/aws_creds.json)
          SECRET_KEY=$(jq -r '.aws_secret_access_key // .secret_key // empty' /tmp/aws_creds.json)
          TOKEN=$(jq -r '.aws_session_token // .session_token // empty' /tmp/aws_creds.json)
          if [ -z "$KEY_ID" ] || [ -z "$SECRET_KEY" ]; then
            echo "::error::Não foi possível extrair aws_access_key_id ou aws_secret_access_key do secret AWS_CREDENTIALS."
            exit 1
          fi
          echo "AWS_ACCESS_KEY_ID=$KEY_ID" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$SECRET_KEY" >> $GITHUB_ENV
          echo "AWS_SESSION_TOKEN=$TOKEN" >> $GITHUB_ENV
          echo "AWS_REGION=us-east-1" >> $GITHUB_ENV
          rm -f /tmp/aws_creds.json

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Extrair Variaveis da Aplicacao (APP_SECRETS JSON)
        env:
          APP_SECRETS_RAW: ${{ secrets.APP_SECRETS }}
        run: |
          if [ -n "$APP_SECRETS_RAW" ]; then
            echo "$APP_SECRETS_RAW" | tr -d '\r' > /tmp/app_secrets.json
            echo "JWT_SECRET=$(jq -r '.jwt_secret // empty' /tmp/app_secrets.json)" >> $GITHUB_ENV
            echo "CLIENT_ID=$(jq -r '.client_id // empty' /tmp/app_secrets.json)" >> $GITHUB_ENV
            echo "CLIENT_SECRET=$(jq -r '.client_secret // empty' /tmp/app_secrets.json)" >> $GITHUB_ENV
            echo "TENANT_ID=$(jq -r '.tenant_id // "common"' /tmp/app_secrets.json)" >> $GITHUB_ENV
            echo "REDIRECT_URI=$(jq -r '.redirect_uri // "http://localhost:8080/login/oauth2/code/azure"' /tmp/app_secrets.json)" >> $GITHUB_ENV
            rm -f /tmp/app_secrets.json
          fi

      - name: Configurar Chave SSH Privada
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/vockey.pem
          chmod 400 ~/.ssh/vockey.pem

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Instalar Ansible no Runner
        run: |
          sudo apt update
          sudo apt install -y ansible

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply (Gera Inventário e Variáveis do Ansible)
        working-directory: terraform
        env:
          TF_VAR_enable_observability: ${{ github.event.inputs.enable_observability || false }}
          TF_VAR_auto_run_ansible: false
        run: |
          terraform apply -auto-approve

      - name: Aguardar Inicialização do SSH das Instâncias
        run: sleep 30

      - name: Executar Ansible Playbook (Deploy Automático de Tudo)
        working-directory: ansible
        env:
          JWT_SECRET: ${{ env.JWT_SECRET || secrets.JWT_SECRET }}
          CLIENT_ID: ${{ env.CLIENT_ID || secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ env.CLIENT_SECRET || secrets.CLIENT_SECRET }}
          TENANT_ID: ${{ env.TENANT_ID || secrets.TENANT_ID || 'common' }}
          REDIRECT_URI: ${{ env.REDIRECT_URI || secrets.REDIRECT_URI }}
        run: |
          ansible-playbook -i inventories/production.ini playbooks/site.yml

      - name: Exibir Informações de Acesso
        working-directory: terraform
        run: |
          echo "============================================="
          echo "URL do Load Balancer (Frontend): http://$(terraform output -raw alb_dns)"
          echo "IP Privado do Banco MySQL: $(terraform output -raw db_private_ip)"
          echo "============================================="
