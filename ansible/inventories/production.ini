[app]
ec2-app-a ansible_host=100.61.117.161
ec2-app-b ansible_host=54.89.102.74

[observability]
ec2-observability ansible_host=54.90.161.52

[backend]
ec2-backend-a ansible_host=10.0.3.141
ec2-backend-b ansible_host=10.0.4.174

[db]
ec2-db ansible_host=10.0.5.130

[private:children]
backend
db

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/vokey.pem
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ConnectTimeout=10'
efs_dns=fs-0d9cb8a562f7910c3.efs.us-east-1.amazonaws.com
observability_aws_auth_enabled=true
prometheus_enable_cloudwatch_exporter_scrape=true
alertmanager_sns_topic_arn=

[private:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ConnectTimeout=10 -o ProxyCommand="ssh -i ~/.ssh/vokey.pem -o StrictHostKeyChecking=no -W %h:%p ubuntu@100.61.117.161"'
