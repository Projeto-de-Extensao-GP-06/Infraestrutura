[app]
ec2-app-a ansible_host=
ec2-app-b ansible_host=

[observability]
ec2-observability ansible_host=

[backend]
ec2-backend-a ansible_host=
ec2-backend-b ansible_host=

[db]
ec2-db ansible_host=

[private:children]
backend
db

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/Key-All.pem
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ConnectTimeout=10'
efs_dns=
observability_aws_auth_enabled=true
prometheus_enable_cloudwatch_exporter_scrape=true
alertmanager_sns_topic_arn=

[private:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ConnectTimeout=10 -o ProxyJump=ubuntu@52.207.214.60'
