---
# ──────────────────────────────────────────────────────────────────────────────
# Playbook: swarm.yml
# Inicializa o Docker Swarm e faz o deploy da stack SGPJ.
# Executa em fases ordenadas para garantir que todos os workers estejam conectados
# e rotulados antes do docker stack deploy.
# ──────────────────────────────────────────────────────────────────────────────

- name: 1. Inicializar Docker Swarm no Manager
  hosts: "{{ groups['app'][0] }}"
  become: true
  tasks:
    - name: Executar inicializacao do Manager
      ansible.builtin.include_role:
        name: swarm
        tasks_from: manager_init.yml

- name: 2. Conectar Workers ao Swarm
  hosts: app:backend
  become: true
  tasks:
    - name: Executar entrada dos Workers
      ansible.builtin.include_role:
        name: swarm
        tasks_from: worker_join.yml
      when: inventory_hostname != groups['app'][0]

- name: 3. Pre-requisitos dos nos (ECR login e configuracao do Nginx)
  hosts: app:backend
  become: true
  tasks:
    - name: Executar preparacao dos nos
      ansible.builtin.include_role:
        name: swarm
        tasks_from: node_prep.yml

- name: 4. Manager rotula nos e faz deploy da stack SGPJ
  hosts: "{{ groups['app'][0] }}"
  become: true
  tasks:
    - name: Executar rotulacao e deploy da stack
      ansible.builtin.include_role:
        name: swarm
        tasks_from: deploy_stack.yml
