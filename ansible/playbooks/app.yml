---
- name: Deploy da aplicacao frontend
  hosts: app
  become: true

  pre_tasks:
    - name: Carregar segredos locais (secrets.yml) se existirem
      ansible.builtin.include_vars:
        file: "{{ item }}"
      with_first_found:
        - files:
            - "{{ playbook_dir }}/../secrets.yml"
            - "{{ playbook_dir }}/secrets.yml"
          skip: true

  roles:
    - app
