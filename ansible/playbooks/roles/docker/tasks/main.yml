---
# ──────────────────────────────────────────────────────────────────────────────
# role: docker
# Substitui: deploy_application.sh + deploy_backend.sh + deploy_db.sh
#
# Instala Docker CE + Docker Compose plugin em qualquer instância Ubuntu.
# Roda em: [all] — app, backend e db.
# ──────────────────────────────────────────────────────────────────────────────

- name: Forçar IPv4 no apt para evitar timeout IPv6
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/99force-ipv4
    content: 'Acquire::ForceIPv4 "true";'
    mode: "0644"

- name: Instalar dependências base
  apt:
    name:
      - ca-certificates
      - curl
      - nfs-common
    state: present
    update_cache: yes
  retries: 5
  delay: 10
  register: apt_base_result
  until: apt_base_result is success

- name: Criar diretório de keyrings
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Baixar chave GPG do Docker
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0444"

- name: Adicionar repositório Docker
  deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_distribution_release }}"
    components: stable
    signed_by: /etc/apt/keyrings/docker.asc
    architectures: "{{ ansible_architecture | replace('x86_64', 'amd64') }}"
    state: present

- name: Instalar Docker CE e plugins
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes
  retries: 5
  delay: 10
  register: apt_docker_result
  until: apt_docker_result is success

- name: Habilitar e iniciar serviço Docker
  systemd:
    name: docker
    enabled: yes
    state: started

- name: Adicionar usuário ubuntu ao grupo docker
  user:
    name: ubuntu
    groups: docker
    append: yes

- name: Criar diretório de mount do EFS
  file:
    path: /mnt/efs-sgpj
    state: directory
    mode: "0777"
  when:
    - efs_dns is defined
    - "'app' in group_names or 'backend' in group_names"

- name: Montar EFS e persistir no fstab
  ansible.posix.mount:
    path: /mnt/efs-sgpj
    src: "{{ efs_dns }}:/"
    fstype: nfs4
    opts: nfsvers=4.1,rsize=1048576,wsize=1048576,hard,timeo=600,retrans=2,noresvport,_netdev
    state: mounted
  when:
    - efs_dns is defined
    - "'app' in group_names or 'backend' in group_names"

- name: Criar estrutura padrao de volumes no EFS
  file:
    path: "{{ item }}"
    state: directory
    mode: "0777"
  loop:
    - /mnt/efs-sgpj/volumes
    - /mnt/efs-sgpj/volumes/nginx
    - /mnt/efs-sgpj/volumes/nginx/html
    - /mnt/efs-sgpj/volumes/nginx/conf
    - /mnt/efs-sgpj/volumes/backend
    - /mnt/efs-sgpj/volumes/backend/uploads
    - /mnt/efs-sgpj/volumes/backend/logs
    - /mnt/efs-sgpj/volumes/shared
  when:
    - efs_dns is defined
    - "'app' in group_names or 'backend' in group_names"
