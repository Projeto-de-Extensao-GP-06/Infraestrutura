---
# ──────────────────────────────────────────────────────────────────────────────
# role: swarm (tasks/main.yml)
# ──────────────────────────────────────────────────────────────────────────────

- name: Inicializar Docker Swarm no Manager
  ansible.builtin.include_tasks: manager_init.yml
  when: inventory_hostname == groups['app'][0]

- name: Workers entram no Swarm
  ansible.builtin.include_tasks: worker_join.yml
  when: inventory_hostname != groups['app'][0]

- name: Preparacao dos nos (ECR login e configuracao do Nginx)
  ansible.builtin.include_tasks: node_prep.yml

- name: Rotulacao dos nos e deploy da stack no Manager
  ansible.builtin.include_tasks: deploy_stack.yml
  when: inventory_hostname == groups['app'][0]
