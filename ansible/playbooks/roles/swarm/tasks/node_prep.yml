---
- name: Garantir AWS CLI instalado em todos os nodes para autenticação ECR
  ansible.builtin.shell: |
    if ! command -v aws &>/dev/null; then
      apt-get update -y && apt-get install -y unzip curl
      curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "/tmp/awscliv2.zip"
      unzip -q -o /tmp/awscliv2.zip -d /tmp
      /tmp/aws/install --update
      rm -rf /tmp/aws /tmp/awscliv2.zip
    fi
  become: true
  when: use_ecr | default(false)

- name: Autenticar Docker no ECR em todos os nodes (app + backend)
  ansible.builtin.shell: |
    aws ecr get-login-password --region {{ aws_region }} | docker login --username AWS --password-stdin {{ ecr_registry_url }}
    aws ecr get-login-password --region {{ aws_region }} | sudo docker login --username AWS --password-stdin {{ ecr_registry_url }}
  become: false
  when: use_ecr | default(false)

- name: Baixar a imagem mais recente do Frontend em todos os nós app
  ansible.builtin.shell: docker pull {{ ecr_frontend_image }}
  when:
    - use_ecr | default(false)
    - inventory_hostname in groups['app']

- name: Baixar a imagem mais recente do Backend em todos os nós backend
  ansible.builtin.shell: docker pull {{ ecr_backend_image }}
  when:
    - use_ecr | default(false)
    - inventory_hostname in groups['backend']

- name: Criar diretorio /opt/nginx em todos os nós app
  ansible.builtin.file:
    path: /opt/nginx
    state: directory
    mode: "0755"
  when: inventory_hostname in groups['app']

- name: Renderizar default.conf do Nginx com balanceamento direto para o backend
  ansible.builtin.template:
    src: default.conf.j2
    dest: /opt/nginx/default.conf
    mode: "0644"
  when: inventory_hostname in groups['app']
