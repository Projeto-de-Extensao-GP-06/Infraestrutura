---
- name: Aguardar nós workers estarem visíveis no Swarm
  ansible.builtin.pause:
    seconds: 5

- name: Aplicar labels de placement (role=app e role=backend) usando os grupos do inventario
  ansible.builtin.shell: |
    # Identifica o Docker NodeID correspondente ao hostname/IP de cada host do inventario
    {% for host in groups['app'] %}
    node_id=$(docker node ls --filter "name={{ hostvars[host]['ansible_hostname'] | default(host) }}" -q || true)
    if [ -n "$node_id" ]; then
      docker node update --label-add role=app "$node_id"
    fi
    {% endfor %}
    {% for host in groups['backend'] %}
    node_id=$(docker node ls --filter "name={{ hostvars[host]['ansible_hostname'] | default(host) }}" -q || true)
    if [ -n "$node_id" ]; then
      docker node update --label-add role=backend "$node_id"
    fi
    {% endfor %}
    # Garante que o próprio Manager sempre receba a label role=app
    docker node update --label-add role=app $(docker info --format '{{ '{{' }}.Swarm.NodeID{{ '}}' }}') || true
  changed_when: false

- name: Criar diretório do Swarm stack no Manager
  ansible.builtin.file:
    path: /opt/swarm
    state: directory
    mode: "0755"

- name: Gerar stack.yml no Manager
  ansible.builtin.template:
    src: stack.yml.j2
    dest: "{{ swarm_stack_file }}"
    mode: "0644"

- name: Deploy da stack SGPJ no Swarm
  ansible.builtin.shell: >
    docker stack deploy
    --with-registry-auth
    --compose-file {{ swarm_stack_file }}
    {{ swarm_stack_name }}
  register: stack_deploy
  changed_when: "'Updating' in stack_deploy.stdout or 'Creating' in stack_deploy.stdout"
