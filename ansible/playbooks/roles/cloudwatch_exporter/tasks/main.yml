---
- name: Criar rede de observabilidade
  community.docker.docker_network:
    name: "{{ cloudwatch_exporter_network }}"

- name: Criar diretorio de configuracao do CloudWatch Exporter
  ansible.builtin.file:
    path: "{{ cloudwatch_exporter_config_dir }}"
    state: directory
    mode: "0755"

- name: Renderizar configuracao do CloudWatch Exporter
  ansible.builtin.template:
    src: config.yml.j2
    dest: "{{ cloudwatch_exporter_config_dir }}/config.yml"
    mode: "0644"

- name: Ler credenciais AWS do arquivo local
  ansible.builtin.set_fact:
    _aws_key_id: "{{ lookup('ini', 'aws_access_key_id section=default file=~/.aws/credentials') }}"
    _aws_secret: "{{ lookup('ini', 'aws_secret_access_key section=default file=~/.aws/credentials') }}"
    _aws_token: "{{ lookup('ini', 'aws_session_token section=default file=~/.aws/credentials') }}"
  delegate_to: localhost
  run_once: true

- name: Subir container do CloudWatch Exporter
  community.docker.docker_container:
    name: "{{ cloudwatch_exporter_container_name }}"
    image: "{{ cloudwatch_exporter_image }}"
    state: started
    restart_policy: unless-stopped
    recreate: true
    pull: always
    networks:
      - name: "{{ cloudwatch_exporter_network }}"
    ports:
      - "{{ cloudwatch_exporter_port }}:{{ cloudwatch_exporter_port }}"
    command:
      - /config/config.yml
    env:
      AWS_REGION: "{{ cloudwatch_exporter_region }}"
      AWS_ACCESS_KEY_ID: "{{ _aws_key_id }}"
      AWS_SECRET_ACCESS_KEY: "{{ _aws_secret }}"
      AWS_SESSION_TOKEN: "{{ _aws_token }}"
    volumes:
      - "{{ cloudwatch_exporter_config_dir }}/config.yml:/config/config.yml:ro"
