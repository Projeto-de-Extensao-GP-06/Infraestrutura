---
- name: Validar diretorios de conteudo e configuracao do Nginx no EFS
  ansible.builtin.assert:
    that:
      - nginx_html_host_path is defined
      - nginx_conf_host_path is defined
      - nginx_html_host_path | length > 0
      - nginx_conf_host_path | length > 0
    fail_msg: Defina os caminhos de html e conf do Nginx.

- name: Garantir diretorios de html e conf no EFS
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0777"
  loop:
    - "{{ nginx_html_host_path }}"
    - "{{ nginx_conf_host_path }}"

- name: Publicar configuracao dinamica do Nginx com upstream dos backends
  ansible.builtin.template:
    src: default.conf.j2
    dest: "{{ nginx_conf_host_path }}/default.conf"
    mode: "0644"
    force: true

- name: Subir container Nginx via Docker
  community.docker.docker_container:
    name: "{{ nginx_container_name }}"
    image: "{{ nginx_image }}"
    state: started
    restart_policy: unless-stopped
    recreate: true
    pull: always
    ports:
      - "{{ nginx_host_port }}:{{ nginx_container_port }}"
    volumes:
      - "{{ nginx_html_host_path }}:{{ nginx_html_container_path }}:ro"
      - "{{ nginx_conf_host_path }}:{{ nginx_conf_container_path }}:ro"
