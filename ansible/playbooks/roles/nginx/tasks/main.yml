---
# role: nginx
# Instala o AWS CLI (se ausente), faz login no ECR, puxa a imagem do frontend
# e inicia o container nginx servindo o React baked na imagem Docker.

- name: Criar diretorio local para configuracao do Nginx
  ansible.builtin.file:
    path: /opt/app-frontend/conf.d
    state: directory
    mode: "0755"

- name: Publicar configuracao do Nginx com balanceamento para os backends
  ansible.builtin.template:
    src: default.conf.j2
    dest: /opt/app-frontend/conf.d/default.conf
    mode: "0644"

- name: Instalar dependencias do AWS CLI (curl, unzip)
  ansible.builtin.apt:
    name:
      - curl
      - unzip
    state: present
    update_cache: true

- name: Verificar se AWS CLI ja esta instalado
  ansible.builtin.command: aws --version
  register: aws_cli_check
  changed_when: false
  failed_when: false

- name: Instalar AWS CLI v2 nas instancias de App
  ansible.builtin.shell: |
    curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
    unzip -q -o /tmp/awscliv2.zip -d /tmp
    /tmp/aws/install --update
    rm -rf /tmp/aws /tmp/awscliv2.zip
  when: aws_cli_check.rc != 0
  changed_when: true

- name: Garantir login no Amazon ECR
  ansible.builtin.shell: >
    aws ecr get-login-password --region {{ aws_region }}
    | docker login --username AWS --password-stdin {{ ecr_registry_url }}
  changed_when: false

- name: Baixar imagem mais recente do Frontend no ECR
  ansible.builtin.command: docker pull {{ ecr_frontend_image }}

- name: Subir container do Frontend Nginx via Docker
  community.docker.docker_container:
    name: "{{ nginx_container_name }}"
    image: "{{ ecr_frontend_image }}"
    state: started
    restart_policy: unless-stopped
    recreate: true
    pull: always
    ports:
      - "{{ nginx_host_port }}:{{ nginx_container_port }}"
    volumes:
      - /opt/app-frontend/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
