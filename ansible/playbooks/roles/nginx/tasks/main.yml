---
- name: Criar diretorio local para configuracao do Nginx
  ansible.builtin.file:
    path: /opt/app-frontend/conf.d
    state: directory
    mode: "0755"

- name: Publicar configuracao do Nginx com balanceamento para os backends
  ansible.builtin.template:
    src: default.conf.j2
    dest: /opt/app-frontend/conf.d/default.conf
    mode: "0644"

- name: Garantir login no Amazon ECR
  ansible.builtin.shell: >
    aws ecr get-login-password --region {{ aws_region }}
    | docker login --username AWS --password-stdin {{ ecr_registry_url }}
  changed_when: false

- name: Baixar imagem mais recente do Frontend no ECR
  ansible.builtin.command: docker pull {{ ecr_frontend_image }}

- name: Subir container do Frontend Nginx via Docker
  community.docker.docker_container:
    name: "{{ nginx_container_name }}"
    image: "{{ ecr_frontend_image }}"
    state: started
    restart_policy: unless-stopped
    recreate: true
    pull: always
    ports:
      - "{{ nginx_host_port }}:{{ nginx_container_port }}"
    volumes:
      - /opt/app-frontend/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro