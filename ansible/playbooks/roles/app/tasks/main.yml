---
- name: Criar diretorio para o Frontend
  ansible.builtin.file:
    path: /opt/app-frontend
    state: directory
    mode: "0755"

- name: Verificar se bundle compilado do Frontend existe localmente
  ansible.builtin.stat:
    path: "{{ app_dist_path }}"
  register: local_dist_dir
  delegate_to: localhost
  become: false

- name: Copiar bundle do Frontend para a instancia
  ansible.builtin.copy:
    src: "{{ app_dist_path }}/"
    dest: /opt/app-frontend/dist/
    mode: "0755"
  when: local_dist_dir.stat.exists and local_dist_dir.stat.isdir

- name: Criar Dockerfile para o Frontend (Nginx Alpine)
  ansible.builtin.copy:
    dest: /opt/app-frontend/Dockerfile
    content: |
      FROM nginx:alpine
      COPY dist/ /usr/share/nginx/html/
      EXPOSE 80
    mode: "0644"
  when: local_dist_dir.stat.exists and local_dist_dir.stat.isdir

- name: Build da imagem local do Frontend caso use bundle dist
  community.docker.docker_image:
    name: "sgpj-frontend:latest"
    build:
      path: /opt/app-frontend
    source: build
    force_source: true
  when: local_dist_dir.stat.exists and local_dist_dir.stat.isdir

- name: Sincronizar arquivos estáticos do React para o EFS compartilhado do Nginx
  ansible.builtin.copy:
    src: "{{ app_dist_path }}/"
    dest: "{{ nginx_html_host_path }}/"
    mode: "0755"
  when: local_dist_dir.stat.exists and local_dist_dir.stat.isdir
  ignore_errors: true

- name: Baixar imagem da aplicacao remota (quando nao ha bundle dist local)
  community.docker.docker_image:
    name: "{{ app_image }}"
    source: pull
  when: not (local_dist_dir.stat.exists and local_dist_dir.stat.isdir)

- name: Subir container da aplicacao frontend
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    image: "{{ 'sgpj-frontend:latest' if (local_dist_dir.stat.exists and local_dist_dir.stat.isdir) else app_image }}"
    state: started
    restart_policy: unless-stopped
    recreate: true
    pull: "{{ 'never' if (local_dist_dir.stat.exists and local_dist_dir.stat.isdir) else 'always' }}"
    networks:
      - name: "{{ app_network }}"
    ports:
      - "{{ app_host_port }}:{{ app_container_port }}"
    etc_hosts:
      host.docker.internal: host-gateway
