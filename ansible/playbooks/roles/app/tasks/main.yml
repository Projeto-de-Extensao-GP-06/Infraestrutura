---
- name: Baixar imagem da aplicacao
  community.docker.docker_image:
    name: "{{ app_image }}"
    source: pull

- name: Subir container da aplicacao
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    image: "{{ app_image }}"
    state: started
    restart_policy: unless-stopped
    recreate: true
    pull: always
    networks:
      - name: "{{ app_network }}"
    ports:
      - "{{ app_host_port }}:{{ app_container_port }}"
