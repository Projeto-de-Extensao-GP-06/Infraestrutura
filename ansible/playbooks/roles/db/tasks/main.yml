---
- name: Criar diretorios para persistencia e inicializacao do MySQL
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ mysql_data_dir }}"
    - "{{ mysql_init_dir }}"

- name: Copiar schema.sql para inicializacao automatica do banco
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../scripts/test/schema.sql"
    dest: "{{ mysql_init_dir }}/01-schema.sql"
    mode: "0644"

- name: Baixar imagem oficial do MySQL
  community.docker.docker_image:
    name: "{{ mysql_image }}"
    source: pull

- name: Iniciar container do MySQL
  community.docker.docker_container:
    name: "{{ mysql_container_name }}"
    image: "{{ mysql_image }}"
    state: started
    restart_policy: always
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "{{ mysql_host_port }}:{{ mysql_container_port }}"
    env:
      MYSQL_ROOT_PASSWORD: "{{ mysql_root_password }}"
      MYSQL_DATABASE: "{{ mysql_database }}"
      MYSQL_USER: "{{ mysql_user }}"
      MYSQL_PASSWORD: "{{ mysql_password }}"
    volumes:
      - "{{ mysql_data_dir }}:/var/lib/mysql"
      - "{{ mysql_init_dir }}:/docker-entrypoint-initdb.d:ro"

- name: Aguardar o MySQL inicializar e aceitar conexoes na porta 3306
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: "{{ mysql_host_port }}"
    delay: 5
    timeout: 60
    state: started

- name: Aguardar o MySQL aceitar conexoes autenticadas e estar pronto
  ansible.builtin.command: >
    docker exec {{ mysql_container_name }} mysqladmin ping -h 127.0.0.1 -u {{ mysql_user }} -p{{ mysql_password }}
  register: db_ping
  until: db_ping.rc == 0
  retries: 30
  delay: 4
  changed_when: false

- name: Garantir schema e dados populados em UTF-8 no MySQL
  ansible.builtin.shell: >
    docker exec -i {{ mysql_container_name }} mysql --default-character-set=utf8mb4 -u root -p{{ mysql_root_password }} < {{ mysql_init_dir }}/01-schema.sql

- name: Garantir permissoes totais do usuario da aplicacao a partir de qualquer host
  ansible.builtin.shell: >
    docker exec -i {{ mysql_container_name }} mysql -u root -p{{ mysql_root_password }} -e "
    CREATE USER IF NOT EXISTS '{{ mysql_user }}'@'%' IDENTIFIED BY '{{ mysql_password }}';
    ALTER USER '{{ mysql_user }}'@'%' IDENTIFIED BY '{{ mysql_password }}';
    GRANT ALL PRIVILEGES ON {{ mysql_database }}.* TO '{{ mysql_user }}'@'%';
    FLUSH PRIVILEGES;
    "


