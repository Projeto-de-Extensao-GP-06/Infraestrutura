---
# ──────────────────────────────────────────────────────────────────────────────
# role: backend
# Com Docker Swarm, o deploy do container é feito pela role 'swarm'.
# Esta role cria apenas a estrutura de diretórios necessária no host.
# ──────────────────────────────────────────────────────────────────────────────

- name: Criar diretorio para o Backend
  ansible.builtin.file:
    path: /opt/app-backend
    state: directory
    mode: "0755"

- name: Verificar se ponto de montagem do EFS está acessível
  ansible.builtin.stat:
    path: /mnt/efs-sgpj
  register: efs_mount_check

- name: Validar montagem do EFS antes de criar estrutura do Backend
  ansible.builtin.assert:
    that:
      - efs_mount_check.stat.exists
      - efs_mount_check.stat.isdir
    fail_msg: "O ponto de montagem do EFS (/mnt/efs-sgpj) não foi encontrado ou não está montado. Verifique a configuração do EFS."

- name: Criar diretório de logs do Backend no EFS
  ansible.builtin.file:
    path: /mnt/efs-sgpj/volumes/backend/logs
    state: directory
    mode: "0777"

- name: Criar diretório de uploads do Backend no EFS
  ansible.builtin.file:
    path: /mnt/efs-sgpj/volumes/backend/uploads
    state: directory
    mode: "0777"
