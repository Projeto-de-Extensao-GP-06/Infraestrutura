# role: backend
# Executa a stack do Spring Boot + RabbitMQ usando Docker Compose nativo
# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

- name: Criar diretorio para a stack do Backend
  ansible.builtin.file:
    path: /opt/app-backend
    state: directory
    mode: "0755"

- name: Garantir que o ECR CLI esta configurado se usar ECR
  ansible.builtin.shell: |
    if ! command -v aws &>/dev/null; then
      apt-get update -y && apt-get install -y unzip curl
      curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "/tmp/awscliv2.zip"
      unzip -q -o /tmp/awscliv2.zip -d /tmp
      /tmp/aws/install --update
      rm -rf /tmp/aws /tmp/awscliv2.zip
    fi
  when: use_ecr | default(false)

- name: Autenticar Docker no ECR
  ansible.builtin.shell: |
    aws ecr get-login-password --region {{ aws_region }} | docker login --username AWS --password-stdin {{ ecr_registry_url }}
  when: use_ecr | default(false)
  changed_when: false

- name: Baixar imagem atualizada do Backend
  ansible.builtin.shell: docker pull {{ backend_image }}
  when: use_ecr | default(false)

- name: Baixar imagem atualizada do Agente MarIA
  ansible.builtin.shell: docker pull {{ agent_image }}
  when: use_ecr | default(false)

- name: Renderizar docker-compose.yml do Backend
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/app-backend/docker-compose.yml
    mode: "0644"

- name: Renderizar agent.env do Agente MarIA
  ansible.builtin.template:
    src: agent.env.j2
    dest: /opt/app-backend/agent.env
    mode: "0600"

- name: Renderizar definicao da Stack Swarm do Backend
  ansible.builtin.template:
    src: stack-backend.yml.j2
    dest: /opt/app-backend/stack-backend.yml
    mode: "0644"

- name: Realizar Deploy da Stack no Docker Swarm
  ansible.builtin.command: >
    docker stack deploy
    --with-registry-auth
    --prune
    -c /opt/app-backend/stack-backend.yml
    sgpj_backend
  register: deploy_stack
  changed_when: "'Creating' in deploy_stack.stdout or 'Updating' in deploy_stack.stdout"

