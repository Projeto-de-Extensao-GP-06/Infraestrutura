---
# ──────────────────────────────────────────────────────────────────────────────
# role: backend
# Com Docker Swarm, o deploy do container é feito pela role 'swarm'.
# Esta role cria apenas a estrutura de diretórios necessária no host.
# ──────────────────────────────────────────────────────────────────────────────

- name: Criar diretorio para o Backend
  ansible.builtin.file:
    path: /opt/app-backend
    state: directory
    mode: "0755"

- name: Criar diretório de logs do Backend no EFS
  ansible.builtin.file:
    path: /mnt/efs-sgpj/volumes/backend/logs
    state: directory
    mode: "0777"
  ignore_errors: true

- name: Criar diretório de uploads do Backend no EFS
  ansible.builtin.file:
    path: /mnt/efs-sgpj/volumes/backend/uploads
    state: directory
    mode: "0777"
  ignore_errors: true
