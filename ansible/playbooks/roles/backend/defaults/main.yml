---
# ECR tem prioridade; fallback para Docker Hub
backend_image: "{{ ecr_backend_image | default('lpamorim/sgpj-backend:latest') }}"
backend_container_name: "sgpj-backend"
backend_port: 8080

# Variaveis de seguranca (lidas do secrets.yml, extra-vars ou ENV)
backend_jwt_secret: "{{ jwt_secret | default(lookup('env', 'JWT_SECRET'), true) | default('', true) }}"
backend_client_id: "{{ client_id | default(lookup('env', 'CLIENT_ID'), true) | default('', true) }}"
backend_client_secret: "{{ client_secret | default(lookup('env', 'CLIENT_SECRET'), true) | default('', true) }}"
backend_tenant_id: "{{ tenant_id | default(lookup('env', 'TENANT_ID'), true) | default('common', true) }}"
backend_redirect_uri: "{{ redirect_uri | default(lookup('env', 'REDIRECT_URI'), true) | default('http://localhost:8080/login/oauth2/code/azure', true) }}"
backend_cookie_secure: "{{ cookie_secure | default(lookup('env', 'COOKIE_SECURE'), true) | default('false', true) }}"
backend_datajud_api_key: "{{ datajud_api_key | default(lookup('env', 'DATAJUD_API_KEY'), true) | default('', true) }}"
backend_cloudflare_secret_key: "{{ cloudflare_secret_key | default(lookup('env', 'CLOUDFLARE_SECRET_KEY'), true) | default('', true) }}"

# -- MarIA Agent (Python FastAPI) ----------------------------------------------
agent_image: "{{ ecr_agent_image | default('sgpj-agent:latest') }}"
agent_container_name: "sgpj-agent"
agent_port: 8000
agent_llm_api_key: "{{ llm_api_key | default(lookup('env', 'LLM_API_KEY'), true) | default('', true) }}"
agent_llm_model: "{{ llm_model | default('gemini-3.1-flash-lite') }}"
agent_anonymization_key: "{{ anonymization_key | default('1111222233334444') }}"
agent_jwt_secret: "{{ backend_jwt_secret }}"
agent_cookie_secure: "{{ backend_cookie_secure }}"
