---
# ──────────────────────────────────────────────────────────────────────────────
# playbook: docker.yml
# Instala Docker em TODAS as instâncias (app, backend, db).
#
# Uso:
#   cd infra/ansible
#   ansible-playbook -i inventories/production.ini playbooks/docker.yml
#
# Rodar só numa instância:
#   ansible-playbook -i inventories/production.ini playbooks/docker.yml --limit ec2-app-a
# ──────────────────────────────────────────────────────────────────────────────
- name: Instalar Docker em todas as instâncias
  hosts: all
  become: true

  pre_tasks:
    - name: Forçar IPv4 no apt para evitar falha de conexão IPv6
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/99force-ipv4
        content: 'Acquire::ForceIPv4 "true";'
        mode: "0644"

  roles:
    - docker

