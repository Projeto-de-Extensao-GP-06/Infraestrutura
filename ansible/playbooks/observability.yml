---
- name: Deploy de coletores base (Node Exporter + Alloy)
  hosts: all
  become: true
  vars:
    has_obs: "{{ groups['observability'] is defined and (groups['observability'] | length > 0) }}"
    observability_primary_host: "{{ groups['observability'][0] if (groups['observability'] is defined and groups['observability'] | length > 0) else '' }}"
    alloy_loki_url: "{{ ('http://loki:3100/loki/api/v1/push' if inventory_hostname == observability_primary_host else 'http://' ~ (hostvars[observability_primary_host].ansible_default_ipv4.address | default(hostvars[observability_primary_host].ansible_host)) ~ ':3100/loki/api/v1/push') if has_obs else '' }}"

  roles:
    - role: node_exporter
      when: enable_observability | default(false) | bool
    - role: alloy
      when:
        - enable_observability | default(false) | bool
        - has_obs

- name: Deploy de observabilidade com Prometheus, Loki, Alloy e Grafana
  hosts: observability
  become: true
  vars:
    observability_primary_host: "{{ groups['observability'][0] if (groups['observability'] is defined and groups['observability'] | length > 0) else '' }}"

  roles:
    - role: loki
      when:
        - enable_observability | default(false) | bool
        - inventory_hostname == observability_primary_host
    - role: alertmanager
      when:
        - enable_observability | default(false) | bool
        - inventory_hostname == observability_primary_host
    - role: tempo
      when:
        - enable_observability | default(false) | bool
        - inventory_hostname == observability_primary_host
    - role: prometheus
      when:
        - enable_observability | default(false) | bool
        - inventory_hostname == observability_primary_host
    - role: cloudwatch_exporter
      when:
        - enable_observability | default(false) | bool
        - inventory_hostname == observability_primary_host
        - observability_aws_auth_enabled | default(false) | bool
    - role: grafana
      when:
        - enable_observability | default(false) | bool
        - inventory_hostname == observability_primary_host
