---
- name: Deploy de coletores base (Node Exporter)
  hosts: all
  become: true
  roles:
    - role: node_exporter
      when: enable_observability | default(false) | bool

- name: Deploy de observabilidade com Prometheus, Loki, CloudWatch Exporter e Grafana
  hosts: observability
  become: true
  vars:
    observability_primary_host: "{{ groups['observability'][0] if (groups['observability'] is defined and groups['observability'] | length > 0) else '' }}"

  roles:
    - role: loki
      when:
        - enable_observability | default(false) | bool
        - inventory_hostname == observability_primary_host
    - role: alertmanager
      when:
        - enable_observability | default(false) | bool
        - inventory_hostname == observability_primary_host
    - role: prometheus
      when:
        - enable_observability | default(false) | bool
        - inventory_hostname == observability_primary_host
    - role: cloudwatch_exporter
      when:
        - enable_observability | default(false) | bool
        - inventory_hostname == observability_primary_host
    - role: grafana
      when:
        - enable_observability | default(false) | bool
        - inventory_hostname == observability_primary_host
