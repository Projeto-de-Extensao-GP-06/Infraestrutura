[defaults]
inventory          = inventories/production.ini
roles_path         = playbooks/roles
host_key_checking  = False
remote_user        = ubuntu
private_key_file   = ~/.ssh/vockey.pem
stdout_callback    = default
retry_files_enabled = False
deprecation_warnings = False
forks              = 10
# Tempo de espera por facts/conexao antes de marcar unreachable
gather_timeout     = 60
timeout            = 60

[ssh_connection]
pipelining         = True
connect_timeout    = 30
# Retries automaticos de SSH (util quando instancia ainda esta subindo)
retries            = 5
