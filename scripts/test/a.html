<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Thauany Bezerra</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      width: 100vw;
      background-color: #0f4c6d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      color: #ffffff;
      text-align: center;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .bem-vindo {
      font-size: 14px;
      letter-spacing: 4px;
      margin-bottom: 25px;
      opacity: 0.7;
    }

    .logo {
      font-size: 140px;
      font-weight: 600;
      margin-bottom: 10px;
      letter-spacing: 5px;
    }

    .nome {
      font-size: 42px;
      letter-spacing: 4px;
    }

    .subtitulo {
      font-size: 16px;
      letter-spacing: 6px;
      margin-top: 12px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .logo {
        font-size: 90px;
      }

      .nome {
        font-size: 26px;
      }

      .subtitulo {
        font-size: 12px;
      }

      .bem-vindo {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="bem-vindo">SEJA BEM-VINDO</div>
    <div class="logo">TB</div>
    <div class="nome">THAUANY BEZERRA</div>
    <div class="subtitulo">ADVOGADA</div>
  </div>

</body>
</html>
